name: vai-business-development

services:
  postgres:
    image: postgres:17-alpine
    container_name: vai-bd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vai-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-vai_bd}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vai} -d ${POSTGRES_DB:-vai_bd}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  vai_postgres_data:
